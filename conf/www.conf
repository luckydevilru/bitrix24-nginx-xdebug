[www]
user = 1000
group = 1000

; Для Docker нужно слушать на всех интерфейсах
listen = 9000

; Process Manager настройки
pm = dynamic
pm.max_children = 80          ; Увеличено с 20
pm.start_servers = 20         ; Увеличено с 5
pm.min_spare_servers = 10     ; Увеличено с 5
pm.max_spare_servers = 30     ; Увеличено с 10
pm.process_idle_timeout = 30s ; Увеличено с 10s
pm.max_requests = 500         ; Оставлено

; Таймаут для зависших скриптов - КРИТИЧНО!
request_terminate_timeout = 300
request_slowlog_timeout = 10s
slowlog = /var/log/php-fpm-slow.log

; PHP настройки
php_flag[display_errors] = On
php_value[max_execution_time] = 300
php_value[memory_limit] = 512M           ; Увеличено для Bitrix24
php_value[upload_max_filesize] = 50M
php_value[post_max_size] = 50M

; Оптимизация для Bitrix24
php_value[opcache.enable] = 1
php_value[opcache.memory_consumption] = 512
php_value[opcache.max_accelerated_files] = 100000
php_value[opcache.revalidate_freq] = 0

; Логирование
catch_workers_output = yes
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php-fpm-error.log
