volumes:
  java_nginx_conf: { }
  mimo_agent_data: { }
# services.nginx.networks.bx24_network
services:
  nginx:
    image: nginx:latest
    container_name: nginx_bx24
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /run/media/iboss/udata/dev/php:/var/www/html
      - ./certs:/etc/nginx/ssl
      - ./kafka_certs:/etc/nginx/ssl/kafka_abs/
    depends_on:
      - php
      - java
    networks:
      bx24-local: # Локальная сеть для общения с PHP и Java
        aliases:
          # Алиасы нужны и здесь: Docker DNS отдаёт их контейнерам
          # (php/java/mariadb) в этой сети. Без них запрос на b24.doc
          # проваливается на хостовый резолвер, где 127.0.0.1 b24.doc
          # (нужный для браузера на хосте) и curl внутри php получает
          # Connection refused на 127.0.0.1:443.
          - b24.doc
          - bxapps.doc
      bx24_network: # Внешняя сеть для связи с AI и алиасов
        aliases:
          - b24.doc
          - bxapps.doc
          - "*.java.loc"

  php:
    build: .
    container_name: php_bx24
    user: "1000:1000"
    environment:
      - HOME=/home/mimo
    volumes:
      - /run/media/iboss/udata/dev/php:/var/www/html
      - ./conf/bxapps.conf:/usr/local/etc/php-fpm.d/bxapps.conf
      - ./conf/bxapps.conf:/usr/local/etc/php-fpm.d/b24.conf
      - ./php.ini:/usr/local/etc/php/php.ini
      - ./certs:/usr/local/share/ca-certificates/
      - ./kafka_certs:/etc/nginx/ssl/kafka_abs/
      - ./sessions:/var/lib/php/sessions:rw
      - mimo_agent_data:/home/mimo
    networks:
      - bx24-local

  java:
    image: eclipse-temurin:21-jre
    container_name: java_bx24
    working_dir: /apps
    volumes:
      - /run/media/iboss/udata/dev/java:/apps
      - ./certs:/usr/local/share/ca-certificates/
      - java_nginx_conf:/etc/nginx/java
    environment:
      - JAVA_OPTS=-Xmx256m -Xms128m
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_USER=bitrix
      - DB_PASSWORD=1234
    ports:
      - "8080-8099:8080-8099"
    depends_on:
      - mariadb
    networks:
      - bx24-local
    restart: unless-stopped

  mariadb:
    image: mariadb:11.7
    container_name: mariadb_bx24
    environment:
      MARIADB_ROOT_PASSWORD: 123456
      MARIADB_DATABASE: sitemanager
      MARIADB_USER: bitrix
      MARIADB_PASSWORD: 1234
    #user: "999:952"
    # Проброс на хост (только localhost), чтобы ai-agents (host-сеть) подключался
    # стабильно по 127.0.0.1:3306, а не по "плавающему" bridge-IP контейнера,
    # который меняется при каждом рестарте.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./my.cnf:/etc/mysql/conf.d/my.cnf
      - /var/lib/mysql:/var/lib/mysql
    ulimits:
      nofile:
        soft: 128000
        hard: 128000
    networks:
      - bx24-local

networks:
  bx24-local:
    driver: bridge
  bx24_network:
    external: true
    name: bx24_network